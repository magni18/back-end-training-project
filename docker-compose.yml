services:
  db:
    image: postgres:15
    env_file:
      - .env
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Migrations
  migrate:
    build: ./Backend
    command: ["sh", "-c", "run-migrations.sh"]
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

volumes:
  pg_data:
